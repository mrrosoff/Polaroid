[platformio]
default_envs = polaroid

[common]
; C++20 for std::span, which is what lets row buffers travel as a pointer and a
; length that cannot disagree with each other.
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
    -std=gnu++17

; Seeed XIAO ESP32S3: 8 MB flash (53 photos), onboard LiPo charging, and a
; deep-sleep floor Seeed actually specifies. Pin map is in Config.h.
[env:polaroid]
; pioarduino, not the official espressif32 package: that one stopped at Arduino
; 2.0.x and its GCC 8.4, which has no <span> and no constexpr <algorithm>. This
; is Arduino 3.x on ESP-IDF 5.x, where the C++20 the rest of this repo assumes
; actually exists.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

monitor_speed = 115200
upload_speed = 921600

; POWER: PSRAM stays off. The framebuffer is streamed row by row and never
; buffered, so there is nothing to put in it — and an initialized PSRAM die
; costs current in deep sleep for no return.
board_build.arduino.memory_type = qio_qspi
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -I src
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0

lib_deps =
    adafruit/Adafruit LIS3DH @ ^1.3.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0

; Host-side tests. No hardware, no Arduino — the logic under test is
; deliberately free of both so it can run here.
; DIAGNOSTIC ONLY, not shipping firmware. Boots, reads the battery, arms the
; motion wake so it can be read back with a shake, and sleeps. No panel, no
; WiFi, no filesystem. Splits an unexplained sleep current into "something this
; firmware drives" and "the board itself".
[env:sleep-only]
extends = env:polaroid
build_flags =
    ${env:polaroid.build_flags}
    -D POLAROID_SLEEP_ONLY

[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -D POLAROID_NATIVE_TEST
    -I include
build_src_filter = -<*>
