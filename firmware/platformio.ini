[platformio]
; The XIAO is the board this is built around. `polaroid` is the generic
; SuperMini profile — different pinout, useful for prototyping. See
; docs/HARDWARE.md.
default_envs = polaroid-xiao

[common]
; C++20 for std::span, which is what lets row buffers travel as a pointer and a
; length that cannot disagree with each other.
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
    -std=gnu++17

[env:polaroid]
; pioarduino, not the official espressif32 package: that one stopped at Arduino
; 2.0.x and its GCC 8.4, which has no <span> and no constexpr <algorithm>. This
; is Arduino 3.x on ESP-IDF 5.x, where the C++20 the rest of this repo assumes
; actually exists.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_mode = qio
board_build.partitions = partitions_4mb.csv
board_build.filesystem = littlefs

; wiring_main.cpp and shake_main.cpp are alternate entry points, each built
; only by its own bring-up env.
build_src_filter = +<*> -<wiring_main.cpp> -<shake_main.cpp>

monitor_speed = 115200
upload_speed = 921600

; POWER: PSRAM stays off even on the R2 boards that have it. The framebuffer is
; streamed row by row and never buffered, so there is nothing to put in it —
; and an initialized PSRAM die costs current in deep sleep for no return.
; Confirm which part you have with: pio run -t nobuild && esptool.py flash_id
board_build.arduino.memory_type = qio_qspi
build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0

lib_deps =
    adafruit/Adafruit LIS3DH @ ^1.3.0
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    bblanchon/ArduinoJson @ ^7.2.0
    https://github.com/tzapu/WiFiManager.git#v2.0.17

; Same board with 8 MB flash — 53 photos.
[env:polaroid-8mb]
extends = env:polaroid
board_upload.flash_size = 8MB
board_build.partitions = partitions_8mb.csv

; The N16R8 variant: 16 MB flash, 123 photos.
[env:polaroid-16mb]
extends = env:polaroid
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

; Seeed XIAO ESP32S3. 8 MB flash (53 photos), onboard LiPo charging, and a
; deep-sleep floor Seeed actually specifies. Different pinout — see Config.h.
[env:polaroid-xiao]
extends = env:polaroid
board = seeed_xiao_esp32s3
board_build.partitions = partitions_8mb.csv
build_flags =
    ${common.build_flags}
    -D POLAROID_BOARD_XIAO
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0
    -D BOARD_HAS_PSRAM=0

; Host-side tests. No hardware, no Arduino — the logic under test is deliberately
; free of both so it can run here.
[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -D POLAROID_NATIVE_TEST
    -I include
build_src_filter = -<*>

; Same host-side tests compiled against the XIAO pin map, so a duplicate or a
; non-RTC wake pin in that branch of Config.h fails on the laptop rather than
; on a board with no headers left to probe.
[env:native-xiao]
extends = env:native
build_flags =
    ${common.build_flags}
    -D POLAROID_NATIVE_TEST
    -D POLAROID_BOARD_XIAO
    -I include

; Bring-up only: color bars straight to the panel, no filesystem or network.
; Swaps wiring_main.cpp in for main.cpp. See docs/HARDWARE.md.
[env:wiring-test]
extends = env:polaroid-xiao
build_src_filter = +<*> -<main.cpp> -<shake_main.cpp>

; Shake calibration: arms the real detectors and reports what
; Motion::classifyWakeEvent decides. No panel, no network.
[env:shake-test]
extends = env:polaroid-xiao
build_src_filter = +<*> -<main.cpp> -<wiring_main.cpp>
